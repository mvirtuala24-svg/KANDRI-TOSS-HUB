<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KANDRI TOSS HUB</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        
        body {
            background-color: #030712;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        /* Accurate Stadium Background Canvas Layout */
        .stadium-canvas {
            width: 100%;
            max-width: 850px;
            height: 480px;
            position: relative;
            background: radial-gradient(circle at center, rgba(16, 37, 76, 0.6) 0%, #030712 100%), 
                        url('https://images.unsplash.com/photo-1540747737956-378724044432?q=80&w=1200') no-repeat center center;
            background-size: cover;
            border: 2px solid #1e293b;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Top Header Navigation Deck */
        .top-deck {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .center-blank-bar {
            flex-grow: 1;
            max-width: 65%;
            height: 32px;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            margin-right: 15px;
        }

        .admin-panel-trigger {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .admin-gear-btn {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8;
            font-size: 11px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 0.5px;
        }

        .live-status-pill {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255,255,255,0.05);
            color: #64748b;
            font-size: 9px;
            padding: 3px 8px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .live-status-pill.active {
            color: #ff4a4a;
            border-color: rgba(255, 74, 74, 0.4);
            font-weight: bold;
            animation: pulse-glow 1.5s infinite;
        }

        /* Main Field Matchup Grid */
        .arena-core {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        /* Premium Glassmorphic Input Panels */
        .team-pod {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(30, 41, 59, 0.7) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 12px 20px;
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .team-pod label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .team-pod select {
            background: transparent;
            border: none;
            color: #d4af37;
            font-size: 18px;
            font-weight: 900;
            outline: none;
            cursor: pointer;
            width: 100%;
            letter-spacing: 0.5px;
        }

        .team-pod select option { background: #0f172a; color: #fff; }

        /* Gold Coin Token Display */
        .central-token {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle, #fceabb 0%, #f8b500 60%, #c59b27 100%);
            border: 4px solid #fff;
            box-shadow: 0 0 35px rgba(248, 181, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }

        /* Dynamic Neon Glow Overlay Layer */
        .token-glow-layer {
            position: absolute;
            width: 146px; height: 146px;
            border-radius: 50%;
            border: 2px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            display: none;
        }

        .token-text {
            font-size: 24px;
            font-weight: 900;
            color: #5c4008;
            text-shadow: 0 1px 1px rgba(255,255,255,0.3);
        }

        .token-text.countdown-mode {
            font-size: 56px;
            color: #00f0ff;
            font-family: monospace;
            text-shadow: 0 0 15px #00f0ff, 0 0 30px rgba(0,240,255,0.6);
            z-index: 10;
        }

        /* Footer Interactions Block */
        .footer-deck {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .commence-button {
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            border: 1px solid #00f0ff;
            color: #e2e8f0;
            padding: 10px 45px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            text-transform: uppercase;
        }

        .commence-button:disabled {
            border-color: #475569; color: #475569; box-shadow: none; cursor: not-allowed;
        }

        .verdict-banner {
            font-size: 24px; font-weight: 900; color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.7); display: none;
        }

        /* Admin Dashboard Viewport Overlay */
        .admin-modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.96);
            display: none; justify-content: center; align-items: center; z-index: 999;
        }

        .admin-panel-card {
            background: #0f172a; border: 1px solid #d4af37; border-radius: 8px;
            padding: 30px; width: 330px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .admin-panel-card h3 { color: #d4af37; font-size: 22px; margin-bottom: 2px; }
        .hub-signature { font-size: 11px; color: #64748b; margin-bottom: 25px; display: block; text-transform: uppercase; letter-spacing: 0.5px;}
        .admin-panel-card select {
            width: 100%; padding: 12px; background: #1a2333; color: #fff;
            border: 1px solid #334155; border-radius: 6px; font-size: 15px; outline: none; margin-bottom: 25px;
        }
        .admin-exit-btn {
            background: #ef4444; color: white; border: none; padding: 10px 20px;
            border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 100%;
        }

        /* Animations */
        .fast-spin { animation: flipAxis 0.12s infinite linear; }
        @keyframes flipAxis { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div class="stadium-canvas">
        <div class="top-deck">
            <div class="center-blank-bar"></div>
            <div class="admin-panel-trigger">
                <button class="admin-gear-btn" onclick="openAdminPanel()">⚙ ADMIN</button>
                <div class="live-status-pill" id="statusPill">hidden panel</div>
            </div>
        </div>

        <div class="arena-core">
            <div class="team-pod">
                <label>Select Team A</label>
                <select id="teamA">
                    <option value="MUMBAI INDIANS">MUMBAI INDIANS</option>
                    <option value="CHENNAI SUPER KINGS">CHENNAI SUPER KINGS</option>
                    <option value="RCB" selected>RCB</option>
                </select>
            </div>

            <div class="central-token" id="coinToken">
                <div class="token-glow-layer" id="glowRing"></div>
                <div class="token-text" id="coinContent">VS</div>
            </div>

            <div class="team-pod">
                <label>Select Team B</label>
                <select id="teamB">
                    <option value="CHENNAI SUPER KINGS" selected>CHENNAI SUPER KINGS</option>
                    <option value="MUMBAI INDIANS">MUMBAI INDIANS</option>
                    <option value="RCB">RCB</option>
                </select>
            </div>
        </div>

        <div class="footer-deck">
            <div class="verdict-banner" id="verdictText"></div>
            <button class="commence-button" id="tossActionBtn" onclick="runLiveTossSequence()">Commence Toss</button>
        </div>
    </div>

    <div class="admin-modal-backdrop" id="adminBackdrop">
        <div class="admin-panel-card">
            <h3>Admin Override</h3>
            <span class="hub-signature">Deployed by KANDRI TOSS HUB</span>
            
            <label style="display:block; text-align:left; font-size:13px; margin-bottom:8px; color:#94a3b8;">Pre-select Next Winner:</label>
            <select id="overrideDropdown" onchange="broadcastLiveOverride()">
                <option value="FAIR">-- Standard Fair Toss (50/50) --</option>
                <option value="FORCE_A">Force Left Team to Win</option>
                <option value="FORCE_B">Force Right Team to Win</option>
            </select>
            
            <button class="admin-exit-btn" onclick="closeAdminPanel()">Save & Close Control</button>
        </div>
    </div>

    <script>
        const AUTH_TOKEN = "#@Baba@#";
        let stateLock = false;
        let dbRef;

        // Loaded with your real credentials automatically!
        const firebaseConfig = {
            apiKey: "AIzaSyCSZzitSdbcfL-htqiBt3o5bX-Xgj82pEw",
            authDomain: "kandri-toss-hub.firebaseapp.com",
            databaseURL: "https://kandri-toss-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kandri-toss-hub",
            storageBucket: "kandri-toss-hub.appspot.com",
            messagingSenderId: "663441622771",
            appId: "1:663441622771:web:fe93aa15cd7fd64735d986"
        };

        if (firebaseConfig.apiKey) {
            firebase.initializeApp(firebaseConfig);
            dbRef = firebase.database();
            
            dbRef.ref('baba_toss_system/live_setting').on('value', (snapshot) => {
                const liveConfig = snapshot.val() || 'FAIR';
                updateStatusUI(liveConfig);
            });
        }

        function openAdminPanel() {
            if (prompt("Enter Password:") === AUTH_TOKEN) {
                document.getElementById('adminBackdrop').style.display = 'flex';
                if(dbRef) {
                    dbRef.ref('baba_toss_system/live_setting').get().then(snap => {
                        if(snap.exists()) document.getElementById('overrideDropdown').value = snap.val();
                    });
                }
            } else { alert("Access Denied"); }
        }

        function closeAdminPanel() { document.getElementById('adminBackdrop').style.display = 'none'; }

        function broadcastLiveOverride() {
            const val = document.getElementById('overrideDropdown').value;
            if(dbRef) dbRef.ref('baba_toss_system/live_setting').set(val);
        }

        function updateStatusUI(setting) {
            const pill = document.getElementById('statusPill');
            if (setting !== 'FAIR') {
                pill.innerText = "LIVE OVERRIDE ACTIVE";
                pill.classList.add('active');
            } else {
                pill.innerText = "hidden panel";
                pill.classList.remove('active');
            }
        }

        function runLiveTossSequence() {
            if (stateLock) return;
            stateLock = true;

            const btn = document.getElementById('tossActionBtn');
            const txt = document.getElementById('coinContent');
            const coin = document.getElementById('coinToken');
            const ring = document.getElementById('glowRing');
            const verdict = document.getElementById('verdictText');

            verdict.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "Toss in Progress...";
            
            txt.classList.add('countdown-mode');
            coin.classList.add('fast-spin');
            ring.style.display = 'block';

            let timer = 10;
            txt.innerText = timer < 10 ? `0${timer}` : timer;

            const interval = setInterval(() => {
                timer--;
                if (timer > 0) {
                    txt.innerText = timer < 10 ? `0${timer}` : timer;
                } else {
                    clearInterval(interval);
                    coin.classList.remove('fast-spin');
                    txt.classList.remove('countdown-mode');
                    ring.style.display = 'none';
                    txt.innerText = "VS";
                    revealFinalWinner(btn, verdict);
                }
            }, 1000);
        }

        async function revealFinalWinner(btn, verdict) {
            const teamA = document.getElementById('teamA').value;
            const teamB = document.getElementById('teamB').value;
            
            let finalTrigger = 'FAIR';
            if (dbRef) {
                const snap = await dbRef.ref('baba_toss_system/live_setting').get();
                if(snap.exists()) finalTrigger = snap.val();
            }

            let winner = "";
            if (finalTrigger === "FORCE_A") winner = teamA;
            else if (finalTrigger === "FORCE_B") winner = teamB;
            else winner = (Math.random() < 0.5) ? teamA : teamB;

            verdict.innerText = `🎉 ${winner.toUpperCase()} WON THE TOSS! 🎉`;
            verdict.style.display = 'block';

            btn.disabled = false;
            btn.innerText = "Commence Toss";
            stateLock = false;
        }
    </script>
</body>
</html>
